<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img">
  <title>노트북 앞에서 코드를 작성하는 개발자 일러스트</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="120" fill="url(#bg)"/>
  <!-- 몸 -->
  <path d="M52 214c6-40 34-62 68-62s62 22 68 62" fill="#1e1b4b"/>
  <!-- 목 -->
  <rect x="108" y="128" width="24" height="28" rx="10" fill="#f5c9a8"/>
  <!-- 얼굴 -->
  <circle cx="120" cy="100" r="38" fill="#f8d5b8"/>
  <!-- 머리카락 -->
  <path d="M82 96c0-26 17-42 38-42s38 16 38 40c-10-8-24-14-40-14-14 0-26 6-36 16Z" fill="#1f2937"/>
  <!-- 안경 -->
  <g fill="none" stroke="#1f2937" stroke-width="3">
    <circle cx="106" cy="104" r="10"/>
    <circle cx="134" cy="104" r="10"/>
    <path d="M116 104h8"/>
  </g>
  <path d="M110 122q10 7 20 0" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
  <!-- 노트북 -->
  <path d="M60 196h120l10 18H50Z" fill="#cbd5e1"/>
  <rect x="72" y="150" width="96" height="48" rx="6" fill="#0f172a"/>
  <text x="120" y="180" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle" fill="#22d3ee">&lt;/&gt;</text>
</svg>
